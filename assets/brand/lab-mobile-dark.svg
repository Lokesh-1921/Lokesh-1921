<svg xmlns="http://www.w3.org/2000/svg" width="600" height="740" viewBox="0 0 600 740" role="img" aria-labelledby="title desc"><title id="title">The Intelligence Lab</title><desc id="desc">Learning directions: visual deep learning, grounded generation, and tool-based workflows.</desc><g font-family="Arial, Helvetica, sans-serif"><defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B17"/><stop offset="1" stop-color="#0D1426"/></linearGradient>
<linearGradient id="spectrum"><stop stop-color="#68E6FF"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="atmosphere"><stop stop-color="#A78BFA" stop-opacity=".12"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23314B" stroke-width=".6"/></pattern>
</defs><rect x="1" y="1" width="598" height="738" rx="24" fill="url(#surface)" stroke="#23314B"/>
<path d="M32 1H568" stroke="url(#spectrum)" stroke-opacity=".65" stroke-width="2"/><rect x="1" y="1" width="598" height="738" rx="24" fill="url(#grid)" opacity=".35"/><text x="30" y="46" fill="#EAF2FF" font-size="24" font-weight="600" letter-spacing="1.5">THE INTELLIGENCE LAB</text><text x="30" y="78" fill="#68E6FF" font-size="22" font-weight="600" letter-spacing="1.5">LEARNING DIRECTIONS</text><rect x="30" y="110" width="540" height="185" rx="16" fill="#0D1426" stroke="#23314B"/><text x="52" y="146" fill="#68E6FF" font-size="22" font-weight="600" letter-spacing="1">01 / PERCEPTION</text><text x="52" y="190" fill="#EAF2FF" font-size="30" font-weight="600" >Learning to see</text><text x="52" y="233" fill="#A6B4D0" font-size="24" font-weight="400" >Deep learning for</text><text x="52" y="265" fill="#A6B4D0" font-size="24" font-weight="400" >visual understanding.</text><rect x="30" y="315" width="540" height="185" rx="16" fill="#0D1426" stroke="#23314B"/><text x="52" y="351" fill="#A78BFA" font-size="22" font-weight="600" letter-spacing="1">02 / GROUNDING</text><text x="52" y="395" fill="#EAF2FF" font-size="30" font-weight="600" >Learning to reason</text><text x="52" y="438" fill="#A6B4D0" font-size="24" font-weight="400" >Retrieval for grounded</text><text x="52" y="470" fill="#A6B4D0" font-size="24" font-weight="400" >generative systems.</text><rect x="30" y="520" width="540" height="185" rx="16" fill="#0D1426" stroke="#23314B"/><text x="52" y="556" fill="#68E6FF" font-size="22" font-weight="600" letter-spacing="1">03 / AGENCY</text><text x="52" y="600" fill="#EAF2FF" font-size="30" font-weight="600" >Learning to act</text><text x="52" y="643" fill="#A6B4D0" font-size="24" font-weight="400" >Tools, explicit context,</text><text x="52" y="675" fill="#A6B4D0" font-size="24" font-weight="400" >and bounded workflows.</text></g></svg>
