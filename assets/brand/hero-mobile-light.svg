<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650" role="img" aria-labelledby="title desc"><title id="title">NEURAL // LOKESH — Intelligence in Motion</title><desc id="desc">Lokesh. AI engineering, machine learning, computer vision. Turning curiosity into intelligent systems.</desc><g font-family="Arial, Helvetica, sans-serif"><defs>
