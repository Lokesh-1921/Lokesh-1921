<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">Curiosity drives the code. Impact defines the work.</title><desc id="desc">HUMAN // LOKESH. An invitation to build something useful together.</desc><g font-family="Arial, Helvetica, sans-serif"><defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B17"/><stop offset="1" stop-color="#0D1426"/></linearGradient>
<linearGradient id="spectrum"><stop stop-color="#68E6FF"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="atmosphere"><stop stop-color="#A78BFA" stop-opacity=".12"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#23314B" stroke-width=".6"/></pattern>
</defs><rect x="1" y="1" width="598" height="298" rx="24" fill="url(#surface)" stroke="#23314B"/>
<path d="M32 1H568" stroke="url(#spectrum)" stroke-opacity=".65" stroke-width="2"/><rect x="1" y="1" width="598" height="298" rx="24" fill="url(#grid)" opacity=".35"/><style>
@keyframes signal{to{stroke-dashoffset:-200}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.8}}
.signal{animation:signal 16s linear infinite}
.breathe{animation:breathe 10s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.signal,.breathe{animation:none!important}}
</style><text x="30" y="46" fill="#68E6FF" font-size="22" font-weight="600" letter-spacing="2">HUMAN // LOKESH</text><text x="30" y="114" fill="#EAF2FF" font-size="38" font-weight="600" letter-spacing="-1">Curiosity drives the code.</text><text x="30" y="171" fill="#EAF2FF" font-size="38" font-weight="600" letter-spacing="-1">Impact defines the work.</text><text x="30" y="253" fill="#A6B4D0" font-size="23" font-weight="500" letter-spacing="1">LET&#x27;S BUILD SOMETHING USEFUL.</text><path d="M30 211H570" stroke="#23314B"/><path d="M30 211H570" class="signal" stroke="#68E6FF" stroke-dasharray="5 195"/></g></svg>
