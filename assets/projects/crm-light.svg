<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="318" viewBox="0 0 1200 318" role="img" aria-labelledby="title desc"><title id="title">AI-FIRST CRM</title><desc id="desc">Record HCP interactions. Retrieve context from local PDFs. DEVELOPMENT APP. Original conceptual schematic, not an application screenshot.</desc><g font-family="Arial, Helvetica, sans-serif"><defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F8FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="spectrum"><stop stop-color="#087B92"/><stop offset="1" stop-color="#7653C4"/></linearGradient>
<radialGradient id="atmosphere"><stop stop-color="#7653C4" stop-opacity=".22"/><stop offset="1" stop-color="#7653C4" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#D4DFF0" stroke-width=".6"/></pattern>
<clipPath id="panel-clip"><rect x="1" y="1" width="1198" height="316" rx="22"/></clipPath>
</defs><rect x="1" y="1" width="1198" height="316" rx="22" fill="url(#surface)" stroke="#D4DFF0" /><path d="M28 1H1172" fill="none" stroke="url(#spectrum)" stroke-width="2" stroke-opacity=".55"/><style>
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes orbitBack{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes halo{0%,100%{transform:scale(.95);opacity:.2}50%{transform:scale(1.08);opacity:.55}}
@keyframes scan{0%{transform:translateX(0);opacity:0}10%,85%{opacity:.3}100%{transform:translateX(1120px);opacity:0}}
.flow{animation:flow 14s linear infinite}
.orbit{animation:orbit 32s linear infinite;transform-origin:0px 0px}
.orbit-back{animation:orbitBack 44s linear infinite;transform-origin:0px 0px}
.pulse{animation:pulse 10s ease-in-out infinite}
.halo{animation:halo 12s ease-in-out infinite;transform-origin:0px 0px}
.scan{animation:scan 20s linear infinite}
@media(prefers-reduced-motion:reduce){.flow,.orbit,.orbit-back,.pulse,.halo,.scan{animation:none!important}}
</style><rect x="1" y="36" width="3" height="246" rx="1" fill="url(#spectrum)" stroke="none" /><text x="32" y="43" fill="#087B92" font-size="21" font-weight="600" letter-spacing="1">01 / DEVELOPMENT APP</text><text x="32" y="111" fill="#16243F" font-size="40" font-weight="700" letter-spacing="-.7">AI-FIRST CRM</text><text x="32" y="151" fill="#51627D" font-size="24" font-weight="400" >Healthcare workflows &amp; document context</text><text x="32" y="202" fill="#16243F" font-size="24" font-weight="400" >Record HCP interactions. Retrieve context from local PDFs.</text><rect x="32" y="240" width="119" height="38" rx="8" fill="#FFFFFF" stroke="#D4DFF0" /><text x="46" y="266" fill="#51627D" font-size="22" font-weight="500" >FastAPI</text><rect x="163" y="240" width="145" height="38" rx="8" fill="#FFFFFF" stroke="#D4DFF0" /><text x="177" y="266" fill="#51627D" font-size="22" font-weight="500" >LangGraph</text><rect x="320" y="240" width="93" height="38" rx="8" fill="#FFFFFF" stroke="#D4DFF0" /><text x="334" y="266" fill="#51627D" font-size="22" font-weight="500" >FAISS</text><rect x="425" y="240" width="93" height="38" rx="8" fill="#FFFFFF" stroke="#D4DFF0" /><text x="439" y="266" fill="#51627D" font-size="22" font-weight="500" >React</text><g transform="translate(963 143)"><rect x="-152" y="-30" width="88" height="60" rx="12" fill="#FFFFFF" stroke="#D4DFF0" /><text x="-108" y="6" fill="#16243F" font-size="16" font-weight="500" text-anchor="middle">ROUTE</text><path d="M-64 0H-43" fill="none" stroke="#087B92" stroke-width="2"/><rect x="-43" y="-30" width="88" height="60" rx="12" fill="#FFFFFF" stroke="#D4DFF0" /><text x="1" y="6" fill="#16243F" font-size="16" font-weight="500" text-anchor="middle">CONTEXT</text><path d="M45 0H66" fill="none" stroke="#087B92" stroke-width="2"/><rect x="66" y="-30" width="88" height="60" rx="12" fill="#FFFFFF" stroke="#D4DFF0" /><text x="110" y="6" fill="#16243F" font-size="16" font-weight="500" text-anchor="middle">ANSWER</text><path d="M-108 32V68H110V32" fill="none" stroke="#D4DFF0" stroke-dasharray="4 7"/><path d="M-152 47H152" fill="none" stroke="#087B92" stroke-width="1.5" stroke-dasharray="12 228" class="flow" opacity=".5"/><text x="0" y="104" fill="#51627D" font-size="18" font-weight="400" text-anchor="middle">ROUTING + RETRIEVAL</text></g><path d="M32 300H1168" fill="none" stroke="#D4DFF0" stroke-width="1.5"/><path d="M32 300H1168" fill="none" stroke="#087B92" stroke-width="2" stroke-dasharray="28 212" class="flow" style="animation-delay:-3s" opacity=".65"/><text x="1125" y="285" fill="#087B92" font-size="19" font-weight="600" text-anchor="end" letter-spacing="1">VIEW SOURCE</text><path d="M1140 285L1155 270M1140 270H1155V285" fill="none" stroke="#087B92" stroke-width="2"/></g></svg>
