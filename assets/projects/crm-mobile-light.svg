<svg xmlns="http://www.w3.org/2000/svg" width="600" height="466" viewBox="0 0 600 466" role="img" aria-labelledby="title desc"><title id="title">AI-FIRST CRM</title><desc id="desc">Record HCP interactions. Retrieve context from local PDFs. DEVELOPMENT APP. Original conceptual schematic, not an application screenshot.</desc><g font-family="Arial, Helvetica, sans-serif"><defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F8FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="spectrum"><stop stop-color="#087B92"/><stop offset="1" stop-color="#7653C4"/></linearGradient>
<radialGradient id="atmosphere"><stop stop-color="#7653C4" stop-opacity=".22"/><stop offset="1" stop-color="#7653C4" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#D4DFF0" stroke-width=".6"/></pattern>
<clipPath id="panel-clip"><rect x="1" y="1" width="598" height="464" rx="22"/></clipPath>
</defs><rect x="1" y="1" width="598" height="464" rx="22" fill="url(#surface)" stroke="#D4DFF0" /><path d="M28 1H572" fill="none" stroke="url(#spectrum)" stroke-width="2" stroke-opacity=".55"/><style>
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes orbitBack{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes halo{0%,100%{transform:scale(.95);opacity:.2}50%{transform:scale(1.08);opacity:.55}}
@keyframes scan{0%{transform:translateX(0);opacity:0}10%,85%{opacity:.3}100%{transform:translateX(520px);opacity:0}}
.flow{animation:flow 14s linear infinite}
.orbit{animation:orbit 32s linear infinite;transform-origin:0px 0px}
.orbit-back{animation:orbitBack 44s linear infinite;transform-origin:0px 0px}
.pulse{animation:pulse 10s ease-in-out infinite}
.halo{animation:halo 12s ease-in-out infinite;transform-origin:0px 0px}
.scan{animation:scan 20s linear infinite}
@media(prefers-reduced-motion:reduce){.flow,.orbit,.orbit-back,.pulse,.halo,.scan{animation:none!important}}
</style><rect x="1" y="36" width="3" height="394" rx="1" fill="url(#spectrum)" stroke="none" /><text x="32" y="43" fill="#087B92" font-size="21" font-weight="600" letter-spacing="1">01 / DEVELOPMENT APP</text><text x="32" y="111" fill="#16243F" font-size="40" font-weight="700" letter-spacing="-.7">AI-FIRST CRM</text><text x="32" y="151" fill="#51627D" font-size="24" font-weight="400" >Healthcare workflows</text><text x="32" y="182" fill="#51627D" font-size="24" font-weight="400" >&amp; document context</text><text x="32" y="238" fill="#16243F" font-size="26" font-weight="400" >Record HCP interactions.</text><text x="32" y="273" fill="#16243F" font-size="26" font-weight="400" >Retrieve context from local PDFs.</text><rect x="32" y="309" width="256" height="37" rx="8" fill="#FFFFFF" stroke="#D4DFF0" /><text x="46" y="335" fill="#51627D" font-size="23" font-weight="500" >FastAPI</text><rect x="312" y="309" width="256" height="37" rx="8" fill="#FFFFFF" stroke="#D4DFF0" /><text x="326" y="335" fill="#51627D" font-size="23" font-weight="500" >LangGraph</text><rect x="32" y="358" width="256" height="37" rx="8" fill="#FFFFFF" stroke="#D4DFF0" /><text x="46" y="384" fill="#51627D" font-size="23" font-weight="500" >FAISS</text><rect x="312" y="358" width="256" height="37" rx="8" fill="#FFFFFF" stroke="#D4DFF0" /><text x="326" y="384" fill="#51627D" font-size="23" font-weight="500" >React</text><path d="M32 420H568" fill="none" stroke="#D4DFF0" stroke-width="1.5"/><path d="M32 420H568" fill="none" stroke="#087B92" stroke-width="2" stroke-dasharray="28 212" class="flow" style="animation-delay:-3s" opacity=".65"/><text x="538" y="451" fill="#087B92" font-size="21" font-weight="600" text-anchor="end" letter-spacing="1">VIEW SOURCE</text><path d="M550 449L565 434M550 434H565V449" fill="none" stroke="#087B92" stroke-width="2"/></g></svg>
