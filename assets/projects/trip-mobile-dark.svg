<svg xmlns="http://www.w3.org/2000/svg" width="600" height="466" viewBox="0 0 600 466" role="img" aria-labelledby="title desc"><title id="title">TRIP PLANNER AI</title><desc id="desc">Compare short trips within explicit budgets. Synthetic data. SYNTHETIC PROTOTYPE. Original conceptual schematic, not an application screenshot.</desc><g font-family="Arial, Helvetica, sans-serif"><defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B17"/><stop offset="1" stop-color="#0D1426"/></linearGradient>
<linearGradient id="spectrum"><stop stop-color="#68E6FF"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="atmosphere"><stop stop-color="#A78BFA" stop-opacity=".22"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#23314B" stroke-width=".6"/></pattern>
<clipPath id="panel-clip"><rect x="1" y="1" width="598" height="464" rx="22"/></clipPath>
</defs><rect x="1" y="1" width="598" height="464" rx="22" fill="url(#surface)" stroke="#23314B" /><path d="M28 1H572" fill="none" stroke="url(#spectrum)" stroke-width="2" stroke-opacity=".55"/><style>
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes orbitBack{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes halo{0%,100%{transform:scale(.95);opacity:.2}50%{transform:scale(1.08);opacity:.55}}
@keyframes scan{0%{transform:translateX(0);opacity:0}10%,85%{opacity:.3}100%{transform:translateX(520px);opacity:0}}
.flow{animation:flow 14s linear infinite}
.orbit{animation:orbit 32s linear infinite;transform-origin:0px 0px}
.orbit-back{animation:orbitBack 44s linear infinite;transform-origin:0px 0px}
.pulse{animation:pulse 10s ease-in-out infinite}
.halo{animation:halo 12s ease-in-out infinite;transform-origin:0px 0px}
.scan{animation:scan 20s linear infinite}
@media(prefers-reduced-motion:reduce){.flow,.orbit,.orbit-back,.pulse,.halo,.scan{animation:none!important}}
</style><rect x="1" y="36" width="3" height="394" rx="1" fill="url(#spectrum)" stroke="none" /><text x="32" y="43" fill="#68E6FF" font-size="21" font-weight="600" letter-spacing="1">02 / SYNTHETIC PROTOTYPE</text><text x="32" y="111" fill="#EAF2FF" font-size="40" font-weight="700" letter-spacing="-.7">TRIP PLANNER AI</text><text x="32" y="151" fill="#A6B4D0" font-size="24" font-weight="400" >Constraints before</text><text x="32" y="182" fill="#A6B4D0" font-size="24" font-weight="400" >recommendations</text><text x="32" y="238" fill="#EAF2FF" font-size="26" font-weight="400" >Compare short trips within</text><text x="32" y="273" fill="#EAF2FF" font-size="26" font-weight="400" >explicit budgets. Synthetic data.</text><rect x="32" y="309" width="256" height="37" rx="8" fill="#0D1426" stroke="#23314B" /><text x="46" y="335" fill="#A6B4D0" font-size="23" font-weight="500" >TypeScript</text><rect x="312" y="309" width="256" height="37" rx="8" fill="#0D1426" stroke="#23314B" /><text x="326" y="335" fill="#A6B4D0" font-size="23" font-weight="500" >React</text><rect x="32" y="358" width="256" height="37" rx="8" fill="#0D1426" stroke="#23314B" /><text x="46" y="384" fill="#A6B4D0" font-size="23" font-weight="500" >TanStack</text><rect x="312" y="358" width="256" height="37" rx="8" fill="#0D1426" stroke="#23314B" /><text x="326" y="384" fill="#A6B4D0" font-size="23" font-weight="500" >Vitest</text><path d="M32 420H568" fill="none" stroke="#23314B" stroke-width="1.5"/><path d="M32 420H568" fill="none" stroke="#68E6FF" stroke-width="2" stroke-dasharray="28 212" class="flow" style="animation-delay:-6s" opacity=".65"/><text x="538" y="451" fill="#68E6FF" font-size="21" font-weight="600" text-anchor="end" letter-spacing="1">VIEW SOURCE</text><path d="M550 449L565 434M550 434H565V449" fill="none" stroke="#68E6FF" stroke-width="2"/></g></svg>
