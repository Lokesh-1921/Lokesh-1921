<svg xmlns="http://www.w3.org/2000/svg" width="600" height="776" viewBox="0 0 600 776" role="img" aria-labelledby="title desc"><title id="title">HUMAN // LOKESH — Intelligence in Motion</title><desc id="desc">Lokesh. AI engineering, machine learning, generative AI. Turning curiosity into intelligent systems. Original orbit artwork, not measured model internals.</desc><g font-family="Arial, Helvetica, sans-serif"><defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F8FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
