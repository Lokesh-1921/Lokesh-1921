<svg xmlns="http://www.w3.org/2000/svg" width="600" height="136" viewBox="0 0 600 136" role="img" aria-labelledby="title desc"><title id="title">01 / THE ENGINEER BEHIND THE CODE</title><desc id="desc">An animated section signal with stationary, accessible typography.</desc><g font-family="Arial, Helvetica, sans-serif"><defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F8FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="spectrum"><stop stop-color="#087B92"/><stop offset="1" stop-color="#7653C4"/></linearGradient>
<radialGradient id="atmosphere"><stop stop-color="#7653C4" stop-opacity=".22"/><stop offset="1" stop-color="#7653C4" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#D4DFF0" stroke-width=".6"/></pattern>
<clipPath id="panel-clip"><rect x="1" y="1" width="598" height="134" rx="22"/></clipPath>
</defs><rect x="1" y="1" width="598" height="134" rx="22" fill="url(#surface)" stroke="#D4DFF0" /><path d="M28 1H572" fill="none" stroke="url(#spectrum)" stroke-width="2" stroke-opacity=".55"/><style>
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes orbitBack{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes halo{0%,100%{transform:scale(.95);opacity:.2}50%{transform:scale(1.08);opacity:.55}}
@keyframes scan{0%{transform:translateX(0);opacity:0}10%,85%{opacity:.3}100%{transform:translateX(520px);opacity:0}}
.flow{animation:flow 14s linear infinite}
.orbit{animation:orbit 32s linear infinite;transform-origin:0px 0px}
.orbit-back{animation:orbitBack 44s linear infinite;transform-origin:0px 0px}
.pulse{animation:pulse 10s ease-in-out infinite}
.halo{animation:halo 12s ease-in-out infinite;transform-origin:0px 0px}
.scan{animation:scan 20s linear infinite}
@media(prefers-reduced-motion:reduce){.flow,.orbit,.orbit-back,.pulse,.halo,.scan{animation:none!important}}
</style><rect x="24" y="29" width="62" height="50" rx="12" fill="#087B92" stroke="none" fill-opacity=".07"/><text x="55" y="63" fill="#087B92" font-size="25" font-weight="600" text-anchor="middle">01</text><text x="108" y="63" fill="#16243F" font-size="28" font-weight="600" letter-spacing=".3" data-section-title="true">THE ENGINEER</text><text x="108" y="100" fill="#16243F" font-size="28" font-weight="600" letter-spacing=".3" data-section-title="true">BEHIND THE CODE</text><path d="M24 124H576" fill="none" stroke="#D4DFF0" stroke-width="1.5"/><path d="M24 124H576" fill="none" stroke="#087B92" stroke-width="2" stroke-dasharray="28 212" class="flow" style="animation-delay:-2s" opacity=".65"/></g></svg>
