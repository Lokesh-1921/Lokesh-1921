<radialGradient id="atmosphere"><stop stop-color="#A78BFA" stop-opacity=".22"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#23314B" stroke-width=".6"/></pattern>
<clipPath id="panel-clip"><rect x="1" y="1" width="598" height="880" rx="22"/></clipPath>
</defs><rect x="1" y="1" width="598" height="880" rx="22" fill="url(#surface)" stroke="#23314B" /><rect x="1" y="1" width="598" height="880" rx="22" fill="url(#grid)" stroke="none" opacity=".32"/><path d="M28 1H572" fill="none" stroke="url(#spectrum)" stroke-width="2" stroke-opacity=".55"/><text x="32" y="44" fill="#EAF2FF" font-size="23" font-weight="600" letter-spacing="1">THE INTELLIGENCE LAB</text><rect x="32" y="82" width="536" height="218" rx="16" fill="#0D1426" stroke="#23314B" /><text x="54" y="118" fill="#A6B4D0" font-size="21" font-weight="600" letter-spacing=".5">ML FOUNDATIONS</text><text x="54" y="163" fill="#EAF2FF" font-size="31" font-weight="600" >Measure. Learn.</text><text x="54" y="197" fill="#EAF2FF" font-size="31" font-weight="600" >Refine.</text><text x="54" y="234" fill="#A6B4D0" font-size="23" font-weight="400" >Data, evaluation,</text><text x="54" y="262" fill="#A6B4D0" font-size="23" font-weight="400" >and model fundamentals.</text><path d="M54 281H546" fill="none" stroke="#23314B" stroke-width="1.5"/><path d="M54 281H546" fill="none" stroke="#68E6FF" stroke-width="2" stroke-dasharray="28 212" opacity=".65"/><circle cx="545" cy="118" r="3" fill="#68E6FF" opacity=".5"/><rect x="32" y="316" width="536" height="218" rx="16" fill="#0D1426" stroke="#23314B" /><text x="54" y="352" fill="#A6B4D0" font-size="21" font-weight="600" letter-spacing=".5">GROUNDED GENERATION</text><text x="54" y="397" fill="#EAF2FF" font-size="31" font-weight="600" >Context before</text><text x="54" y="431" fill="#EAF2FF" font-size="31" font-weight="600" >answers.</text><text x="54" y="468" fill="#A6B4D0" font-size="23" font-weight="400" >Retrieval and generative</text><text x="54" y="496" fill="#A6B4D0" font-size="23" font-weight="400" >workflows with source context.</text><path d="M54 515H546" fill="none" stroke="#23314B" stroke-width="1.5"/><path d="M54 515H546" fill="none" stroke="#68E6FF" stroke-width="2" stroke-dasharray="28 212" opacity=".65"/><circle cx="545" cy="352" r="3" fill="#A78BFA" opacity=".5"/><rect x="32" y="550" width="536" height="218" rx="16" fill="#0D1426" stroke="#23314B" /><text x="54" y="586" fill="#A6B4D0" font-size="21" font-weight="600" letter-spacing=".5">AGENTIC SYSTEMS</text><text x="54" y="631" fill="#EAF2FF" font-size="31" font-weight="600" >Tools with clear</text><text x="54" y="665" fill="#EAF2FF" font-size="31" font-weight="600" >boundaries.</text><text x="54" y="702" fill="#A6B4D0" font-size="23" font-weight="400" >Routing, explicit context,</text><text x="54" y="730" fill="#A6B4D0" font-size="23" font-weight="400" >and useful actions.</text><path d="M54 749H546" fill="none" stroke="#23314B" stroke-width="1.5"/><path d="M54 749H546" fill="none" stroke="#68E6FF" stroke-width="2" stroke-dasharray="28 212" opacity=".65"/><circle cx="545" cy="586" r="3" fill="#68E6FF" opacity=".5"/><text x="32" y="815" fill="#A6B4D0" font-size="22" font-weight="500" >SIDE EXPLORATION / COMPUTER VISION</text><text x="32" y="850" fill="#A6B4D0" font-size="22" font-weight="400" >Learning through stereo geometry and motion.</text></g></svg>
