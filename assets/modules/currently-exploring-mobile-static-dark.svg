<svg xmlns="http://www.w3.org/2000/svg" width="600" height="882" viewBox="0 0 600 882" role="img" aria-labelledby="title desc"><title id="title">The Intelligence Lab</title><desc id="desc">Learning directions: machine learning foundations, grounded generation, agentic systems. Computer vision is a side exploration. Static reduced-motion version.</desc><g font-family="Arial, Helvetica, sans-serif"><defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B17"/><stop offset="1" stop-color="#0D1426"/></linearGradient>
