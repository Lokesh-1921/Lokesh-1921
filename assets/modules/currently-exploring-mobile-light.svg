<svg xmlns="http://www.w3.org/2000/svg" width="600" height="882" viewBox="0 0 600 882" role="img" aria-labelledby="title desc"><title id="title">The Intelligence Lab</title><desc id="desc">Learning directions: machine learning foundations, grounded generation, agentic systems. Computer vision is a side exploration.</desc><g font-family="Arial, Helvetica, sans-serif"><defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F8FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="spectrum"><stop stop-color="#087B92"/><stop offset="1" stop-color="#7653C4"/></linearGradient>
<radialGradient id="atmosphere"><stop stop-color="#7653C4" stop-opacity=".22"/><stop offset="1" stop-color="#7653C4" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#D4DFF0" stroke-width=".6"/></pattern>
<clipPath id="panel-clip"><rect x="1" y="1" width="598" height="880" rx="22"/></clipPath>
</defs><rect x="1" y="1" width="598" height="880" rx="22" fill="url(#surface)" stroke="#D4DFF0" /><rect x="1" y="1" width="598" height="880" rx="22" fill="url(#grid)" stroke="none" opacity=".32"/><path d="M28 1H572" fill="none" stroke="url(#spectrum)" stroke-width="2" stroke-opacity=".55"/><style>
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes orbitBack{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes halo{0%,100%{transform:scale(.95);opacity:.2}50%{transform:scale(1.08);opacity:.55}}
@keyframes scan{0%{transform:translateX(0);opacity:0}10%,85%{opacity:.3}100%{transform:translateX(520px);opacity:0}}
.flow{animation:flow 14s linear infinite}
.orbit{animation:orbit 32s linear infinite;transform-origin:0px 0px}
.orbit-back{animation:orbitBack 44s linear infinite;transform-origin:0px 0px}
.pulse{animation:pulse 10s ease-in-out infinite}
.halo{animation:halo 12s ease-in-out infinite;transform-origin:0px 0px}
.scan{animation:scan 20s linear infinite}
@media(prefers-reduced-motion:reduce){.flow,.orbit,.orbit-back,.pulse,.halo,.scan{animation:none!important}}
</style><text x="32" y="44" fill="#16243F" font-size="23" font-weight="600" letter-spacing="1">THE INTELLIGENCE LAB</text><rect x="32" y="82" width="536" height="218" rx="16" fill="#FFFFFF" stroke="#D4DFF0" /><text x="54" y="118" fill="#51627D" font-size="21" font-weight="600" letter-spacing=".5">ML FOUNDATIONS</text><text x="54" y="163" fill="#16243F" font-size="31" font-weight="600" >Measure. Learn.</text><text x="54" y="197" fill="#16243F" font-size="31" font-weight="600" >Refine.</text><text x="54" y="234" fill="#51627D" font-size="23" font-weight="400" >Data, evaluation,</text><text x="54" y="262" fill="#51627D" font-size="23" font-weight="400" >and model fundamentals.</text><path d="M54 281H546" fill="none" stroke="#D4DFF0" stroke-width="1.5"/><path d="M54 281H546" fill="none" stroke="#087B92" stroke-width="2" stroke-dasharray="28 212" class="flow" style="animation-delay:-0s" opacity=".65"/><circle cx="545" cy="118" r="3" fill="#087B92" class="pulse" opacity=".5"/><rect x="32" y="316" width="536" height="218" rx="16" fill="#FFFFFF" stroke="#D4DFF0" /><text x="54" y="352" fill="#51627D" font-size="21" font-weight="600" letter-spacing=".5">GROUNDED GENERATION</text><text x="54" y="397" fill="#16243F" font-size="31" font-weight="600" >Context before</text><text x="54" y="431" fill="#16243F" font-size="31" font-weight="600" >answers.</text><text x="54" y="468" fill="#51627D" font-size="23" font-weight="400" >Retrieval and generative</text><text x="54" y="496" fill="#51627D" font-size="23" font-weight="400" >workflows with source context.</text><path d="M54 515H546" fill="none" stroke="#D4DFF0" stroke-width="1.5"/><path d="M54 515H546" fill="none" stroke="#087B92" stroke-width="2" stroke-dasharray="28 212" class="flow" style="animation-delay:-4s" opacity=".65"/><circle cx="545" cy="352" r="3" fill="#7653C4" class="pulse" opacity=".5"/><rect x="32" y="550" width="536" height="218" rx="16" fill="#FFFFFF" stroke="#D4DFF0" /><text x="54" y="586" fill="#51627D" font-size="21" font-weight="600" letter-spacing=".5">AGENTIC SYSTEMS</text><text x="54" y="631" fill="#16243F" font-size="31" font-weight="600" >Tools with clear</text><text x="54" y="665" fill="#16243F" font-size="31" font-weight="600" >boundaries.</text><text x="54" y="702" fill="#51627D" font-size="23" font-weight="400" >Routing, explicit context,</text><text x="54" y="730" fill="#51627D" font-size="23" font-weight="400" >and useful actions.</text><path d="M54 749H546" fill="none" stroke="#D4DFF0" stroke-width="1.5"/><path d="M54 749H546" fill="none" stroke="#087B92" stroke-width="2" stroke-dasharray="28 212" class="flow" style="animation-delay:-8s" opacity=".65"/><circle cx="545" cy="586" r="3" fill="#087B92" class="pulse" opacity=".5"/><text x="32" y="815" fill="#51627D" font-size="22" font-weight="500" >SIDE EXPLORATION / COMPUTER VISION</text><text x="32" y="850" fill="#51627D" font-size="22" font-weight="400" >Learning through stereo geometry and motion.</text></g></svg>
