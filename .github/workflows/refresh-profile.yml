name: Refresh profile visuals

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/refresh-profile.yml

permissions:
  contents: read

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'Lokesh-1921/Lokesh-1921' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false

      - name: Refresh real public activity
        id: activity
        continue-on-error: true
        run: python3 scripts/update_activity.py

      - name: Generate light and dark contribution snakes
        id: snake
        continue-on-error: true
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: Lokesh-1921
          github_token: ${{ github.token }}
          outputs: |
            assets/live/snake-dark.svg?color_snake=#A78BFA&color_dots=#23314B,#1C3B53,#22647C,#359BB5,#68E6FF&color_dot_border=#23314B
            assets/live/snake-light.svg?color_snake=#7653C4&color_dots=#E5EDF8,#C3DFE8,#80BECF,#328CA3,#087B92&color_dot_border=#D4DFF0

      - name: Add accessible labels and reduced-motion support
        if: steps.snake.outcome == 'success'
        run: python3 scripts/finalize_snake.py

      - name: Validate generated and retained assets
        run: python3 scripts/validate_profile.py

      - name: Report refresh status
        env:
          ACTIVITY_RESULT: ${{ steps.activity.outcome }}
          SNAKE_RESULT: ${{ steps.snake.outcome }}
        run: |
          if [ "$ACTIVITY_RESULT" != success ]; then
            echo '::warning::Activity refresh failed. The last verified dashboard and static calendar were retained.'
          fi
          if [ "$SNAKE_RESULT" != success ]; then
            echo '::warning::Snake refresh failed. The previously generated animations were retained.'
          fi
          {
            echo '### Profile visual refresh'
            echo "Public activity: $ACTIVITY_RESULT"
            echo "Contribution snake: $SNAKE_RESULT"
            echo 'Only validated assets are published. Failed updates retain the last good images.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified images and public snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: profile-visuals
          path: assets/live/
          if-no-files-found: error
          retention-days: 1

  publish-assets:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out latest main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          ref: main

      - name: Download validated assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7, Node 24
        with:
          name: profile-visuals
          path: assets/live/

      - name: Commit changed generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/live/
          if git diff --cached --quiet; then
            echo 'No generated assets changed.'
            exit 0
          fi
          git commit -m 'chore(profile): refresh verified activity visuals'
          git push origin HEAD:main
